services:
  - type: web
    name: delicias-da-lu-controle-desperdicio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_FORCE_HTTPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: delicias-da-lu-db
          property: connectionString

databases:
  - name: delicias-da-lu-db
    plan: free
    databaseName: delicias_da_lu
    user: delicias_da_lu
